# Generated by ~/project-radar — `radar sync-agents --write`.
# Engine version: 7453b9e3e7bc   (mismatch means this copy is behind; re-run sync-agents)
#
# Runs the radar gate on every pull request. The engine is vendored in
# .github/radar-gate/ so this needs no secrets and works on forks.
name: radar-gate

on:
  pull_request:
    # labeled/unlabeled: the `radar:trusted` label changes the verdict, so a
    # label change re-runs the gate. ANY label, never skipped: a gate job
    # skipped for an unrelated label reports as passed after a failed gate.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cancel this job when a newer push to the same pull request replaces it
    # (saves Actions minutes). Only those runs share a group: opened, labeled,
    # main, schedule and manual runs each get their own and are never cancelled.
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.action == 'synchronize' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs base...head, so it needs both. A shallow clone has
          # neither the merge base nor the base branch, and the run fails with
          # "could not read the diff" rather than passing by accident.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Review the diff
        id: gate
        env:
          # Passed as data, never interpolated into the script.
          RADAR_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set +e
          python .github/radar-gate/handoff.py \
            --diff "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}" > gate.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat gate.txt

      - name: Publish the findings
        if: ${{ !cancelled() }}   # a cancelled run posts no partial verdict
        run: |
          {
            echo '## radar gate'
            echo
            echo '```'
            cat gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: ${{ !cancelled() }}   # a cancelled run posts no partial verdict
        continue-on-error: true   # forks get a read-only token; the summary above still lands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '**radar gate**'
            echo
            echo '```'
            cat gate.txt
            echo '```'
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md

      - name: Block on unaccepted CRITICAL findings
        run: |
          # Exit code is the verdict: 1 = a CRITICAL nobody accepted in writing,
          # 2 = a credential in the branch, 3 = the diff could not be read.
          exit ${{ steps.gate.outputs.exit }}
