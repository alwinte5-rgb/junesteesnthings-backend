# Generated by ~/project-radar — `radar sync-agents --write`.
# Engine version: 7e09961ba0c6   (mismatch means this copy is behind; re-run sync-agents)
#
# Runs the radar gate on every pull request. The engine is vendored in
# .github/radar-gate/ so this needs no secrets and works on forks.
name: radar-gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs base...head, so it needs both. A shallow clone has
          # neither the merge base nor the base branch, and the run fails with
          # "could not read the diff" rather than passing by accident.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Review the diff
        id: gate
        run: |
          set +e
          python .github/radar-gate/handoff.py \
            --diff "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}" > gate.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat gate.txt

      - name: Publish the findings
        if: always()
        run: |
          {
            echo '## radar gate'
            echo
            echo '```'
            cat gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always()
        continue-on-error: true   # forks get a read-only token; the summary above still lands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '**radar gate**'
            echo
            echo '```'
            cat gate.txt
            echo '```'
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md

      - name: Block on unaccepted CRITICAL findings
        run: |
          # Exit code is the verdict: 1 = a CRITICAL nobody accepted in writing,
          # 2 = a credential in the branch, 3 = the diff could not be read.
          exit ${{ steps.gate.outputs.exit }}
