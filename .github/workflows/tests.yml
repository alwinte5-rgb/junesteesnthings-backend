# Runs the test suite on every pull request and on main, so a PR cannot merge
# with tests failing (#469: #467 merged with occasion-pages.test.js red).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a pull request's run when a newer push to it replaces it (saves
# Actions minutes). Only those runs share a group: every other run (opened,
# labeled, main, schedule, manual) gets its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'synchronize' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The designer (lumise-designer) is a private repo CI cannot clone, so
      # the parity tests that read its source (tests/designer-dir.js) run
      # locally only; every other test file runs here.
      - run: npm run test:ci
